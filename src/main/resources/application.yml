spring:
  application:
    name: crewvoice
  mvc:
    log-request-details: true

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password:
      timeout: 60000  # 연결 타임아웃 (ms)
      lettuce:
        pool:
          max-active: 8  # 최대 연결 수
          max-idle: 8    # 최대 유휴 연결 수
          min-idle: 0    # 최소 유휴 연결 수
          max-wait: -1ms # 최대 대기 시간

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  cloud:
    aws:
      credentials:
        accessKey: ${AWS_ACCESS_KEY_ID}
        secretKey: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ap-northeast-2
      stack:
        auto: false
      s3:
        bucket: ${S3_BUCKET_NAME}

  datasource:
     url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
     username: ${DB_USERNAME}
     password: ${DB_PASSWORD}
     driver-class-name: org.postgresql.Driver

  jpa:
     hibernate:
       ddl-auto: update
     properties:
       hibernate:
         dialect: org.hibernate.dialect.PostgreSQLDialect
         format_sql: true
         jdbc:
           time_zone: Asia/Seoul
     show-sql: true

server:
  port: 8080

# Swagger/OpenAPI 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  show-actuator: false
  api-docs:
    path: /v3/api-docs
  servers:
    - url: http://localhost:8080
      description: Local server
    - url: https://server.crewvoice.cloud
      description: Production server

logging:
  level:
    org.springframework: INFO
    org.skala.crewvoice: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG

security:
  jwt:
    token:
      secret-key: ${BASE64_SECRET_KEY}
      access-expire-length: 3600000 # 1 hour
      refresh-expire-length: 1209600000 # 2 weeks

# FastAPI 콜백 인증 설정
callback:
  api:
    key: ${CALLBACK_API_KEY}

# FastAPI 연동 설정
fastapi:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  callback-url: ${FASTAPI_CALLBACK_URL:http://localhost:8080/api/v1/evaluations/callback}
  timeout:
    connection: 5000  # 5초
    response: 10000   # 10초
