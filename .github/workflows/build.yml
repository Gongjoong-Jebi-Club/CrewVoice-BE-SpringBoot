name: Build and Deploy to EC2

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon -x test

      - name: Set lower case image name
        id: string
        run: echo "image_name=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.string.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=sha
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Set image name to lower case
            IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')

            # Login to GitHub Container Registry with sudo
            echo ${{ secrets.GITHUB_TOKEN }} | sudo docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Pull the latest image with sudo
            sudo docker pull $IMAGE_NAME:latest

            # Create Docker network if it doesn't exist
            sudo docker network create crewvoice-network || true

            # Ensure Redis container is running
            if [ ! "$(sudo docker ps -q -f name=redis-server)" ]; then
              if [ "$(sudo docker ps -aq -f status=exited -f name=redis-server)" ]; then
                # Redis container exists but is stopped - start it
                echo "Starting existing Redis container..."
                sudo docker start redis-server
              else
                # Redis container doesn't exist - create it
                echo "Creating new Redis container..."
                sudo docker run -d --name redis-server \
                  --network crewvoice-network \
                  -p 6379:6379 \
                  --restart always \
                  redis:alpine
              fi
            else
              echo "Redis container is already running"
            fi

            # Connect Redis to network if not already connected
            sudo docker network connect crewvoice-network redis-server 2>/dev/null || true

            # Stop and remove the existing application container (force remove to avoid timing issues)
            sudo docker rm -f crewvoice-be || true

            # Kill any process using port 8080
            sudo fuser -k 8080/tcp || true

            # Run the new container with corrected environment variables
            sudo docker run -d --name crewvoice-be \
              --network crewvoice-network \
              -p 8080:8080 \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e REDIS_HOST=${{ secrets.REDIS_HOST }} \
              -e REDIS_PORT=${{ secrets.REDIS_PORT}} \
              -e S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }} \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e BASE64_SECRET_KEY=${{ secrets.BASE64_SECRET_KEY }} \
              --restart always $IMAGE_NAME:latest

